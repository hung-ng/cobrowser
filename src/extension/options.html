<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cobrowser options</title>
    <style>
      body {
        max-width: 680px;
        margin: 32px;
        font:
          14px system-ui,
          sans-serif;
      }
      textarea {
        box-sizing: border-box;
        display: block;
        margin-top: 8px;
        width: 100%;
        font:
          13px ui-monospace,
          monospace;
      }
      #status {
        min-height: 1.2em;
        color: #555;
      }
      :focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>cobrowser denylist</h1>
      <p id="help">
        One host or host and path per line. Up to 256 lines, 2,048 characters each. Matching tabs
        stay inside the browser.
      </p>
      <label for="denylist">Denylist patterns</label>
      <textarea
        id="denylist"
        rows="16"
        maxlength="524544"
        spellcheck="false"
        aria-describedby="help"
      ></textarea>
      <p>
        <button id="save" type="button">Save</button>
        <button id="restore" type="button">Restore defaults</button>
      </p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
